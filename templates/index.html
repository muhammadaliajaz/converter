<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart File Converter - Free Online PDF & Document Tools</title>
    <meta name="description" content="Free online document converter. Merge, split, compress, and convert PDFs, Word, Excel, PowerPoint, and Image files securely. 100% free with no registration.">
    <meta name="keywords" content="PDF converter, merge PDF, split PDF, compress PDF, PDF to Word, Word to PDF, Excel to PDF, PPT to PDF, Image converter, online PDF tools">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Smart File Converter - All Your Document Tools in One Place">
    <meta property="og:description" content="Convert, compress, merge, translate and edit PDFs, Word documents, Excel sheets, and Images for free online. securely and instantly.">
    <meta property="og:type" content="website">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="canonical" href="http://127.0.0.1:5000/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Smart File Converter",
      "url": "http://127.0.0.1:5000/",
      "description": "A comprehensive web-based document toolkit. Merge, split, compress, translate, and convert PDFs, Word, Excel, and images entirely for free.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #f4f7f6;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #333;
        }
        .tool-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid #eaeaea;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            border-color: #4f46e5;
        }
        .glass-panel {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .drag-area {
            border: 2px dashed #4f46e5;
            transition: all 0.3s ease;
        }
        .drag-area.active {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.05);
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 8px;
            background-color: #4f46e5;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="p-6">

    <!-- HEADER -->
    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold text-indigo-700 mb-2">Smart Tools</h1>
        <p class="text-gray-500">Every tool you need to work with documents, in one place.</p>
    </header>

    <!-- GRID VIEW -->
    <main id="gridContainer" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        
        <!-- Generate cards using a script tag or hardcode -->
        <script>
            const tools = [
                { id: 'merge-pdf', name: 'Merge PDF', icon: '📝', desc: 'Combine multiple PDFs into one.' },
                { id: 'split-pdf', name: 'Split PDF', icon: '✂️', desc: 'Separate pages into multiple PDFs.' },
                { id: 'compress-pdf', name: 'Compress PDF', icon: '🗜️', desc: 'Reduce file size while saving quality.' },
                { id: 'pdf-to-word', name: 'PDF to Word', icon: '📝', desc: 'Convert PDFs to editable DOCX.' },
                { id: 'pdf-to-ppt', name: 'PDF to PPT', icon: '📊', desc: 'Convert PDFs to PowerPoint slides.' },
                { id: 'pdf-to-excel', name: 'PDF to Excel', icon: '📈', desc: 'Extract PDF tables to spreadsheet.' },
                { id: 'word-to-pdf', name: 'Word to PDF', icon: '📄', desc: 'Convert DOCX to standard PDF.' },
                { id: 'ppt-to-pdf', name: 'PPT to PDF', icon: '📄', desc: 'Make PowerPoint slides a PDF.' },
                { id: 'excel-to-pdf', name: 'Excel to PDF', icon: '📄', desc: 'Make spreadsheets into a PDF.' },
                { id: 'pdf-to-jpg', name: 'PDF to JPG', icon: '🖼️', desc: 'Extract PDF pages as images.' },
                { id: 'jpg-to-pdf', name: 'JPG to PDF', icon: '🖼️', desc: 'Combine images into a PDF.' },
                { id: 'unlock-pdf', name: 'Unlock PDF', icon: '🔓', desc: 'Remove password restrictions.' },
                { id: 'protect-pdf', name: 'Protect PDF', icon: '🔒', desc: 'Add password to secure your PDF.' },
                { id: 'page-numbers', name: 'Page Numbers', icon: '🔢', desc: 'Stamp page numbers to a PDF.' },
                { id: 'translate-pdf', name: 'Translate PDF', icon: '🌍', desc: 'Extract and translate PDF text.' },
                { id: 'compress-image', name: 'Compress Image', icon: '🗜️', desc: 'Squeeze images to target KB.' },
                { id: 'convert-image-format', name: 'Convert Image', icon: '🎨', desc: 'Change format (PNG, JPG, WEBP).' }
            ];

            const grid = document.getElementById('gridContainer');
            tools.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card p-6 flex flex-col items-center text-center';
                card.innerHTML = `
                    <div class="text-4xl mb-4">${tool.icon}</div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${tool.name}</h3>
                    <p class="text-sm text-gray-500">${tool.desc}</p>
                `;
                card.onclick = () => openWorkspace(tool);
                grid.appendChild(card);
            });
        </script>
    </main>

    <!-- WORKSPACE VIEW -->
    <section id="workspaceContainer" class="hidden max-w-2xl mx-auto glass-panel p-8">
        <button onclick="closeWorkspace()" class="text-indigo-600 font-semibold mb-6 flex items-center hover:text-indigo-800 transition">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Tools
        </button>

        <div class="text-center mb-8">
            <div id="toolIcon" class="text-5xl mb-3"></div>
            <h2 id="toolTitle" class="text-3xl font-bold text-gray-800">Tool Name</h2>
        </div>

        <form id="uploadForm" class="space-y-6">
            <input type="hidden" id="conversionType" name="conversion_type" value="">

            <!-- Dynamic Settings Container -->
            <div id="dynamicSettings" class="bg-gray-50 p-4 rounded-lg hidden flex flex-col gap-3 border border-gray-100">
                
                <!-- Password (Protect/Unlock) -->
                <div id="passwordBlock" class="hidden">
                    <label class="font-semibold text-gray-700 text-sm">PDF Password</label>
                    <input type="password" name="password" class="w-full mt-1 p-2 border rounded outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Languages (Translate) -->
                <div id="languageBlock" class="hidden">
                    <label class="font-semibold text-gray-700 text-sm">Target Language</label>
                    <select name="target_lang" class="w-full mt-1 p-2 border rounded outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>

                <!-- Compress PDF Level -->
                <div id="compressPdfBlock" class="hidden">
                    <label class="font-semibold text-gray-700 text-sm">Compression Level</label>
                    <select name="compression_level" class="w-full mt-1 p-2 border rounded outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="low">Low (Fast)</option>
                        <option value="medium" selected>Medium (Recommended)</option>
                        <option value="high">High (Smallest Size)</option>
                    </select>
                </div>

                <!-- Image Compress Target KB -->
                <div id="compressImgBlock" class="hidden">
                    <label class="font-semibold text-gray-700 text-sm">Target Size (KB)</label>
                    <input type="number" name="target_kb" value="500" min="10" class="w-full mt-1 p-2 border rounded outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Image Formatting -->
                <div id="imgFormatBlock" class="hidden">
                    <label class="font-semibold text-gray-700 text-sm">Target Image Format</label>
                    <select name="target_format" class="w-full mt-1 p-2 border rounded outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="JPG">JPG</option><option value="PNG">PNG</option>
                        <option value="WEBP">WEBP</option><option value="BMP">BMP</option>
                    </select>
                </div>

            </div>

            <!-- Upload Area -->
            <div id="dropZone" class="drag-area rounded-xl p-10 text-center cursor-pointer flex flex-col items-center justify-center min-h-[200px]">
                <svg class="w-12 h-12 text-indigo-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-lg font-medium text-gray-700 mb-1">Drag files here</p>
                <input type="file" id="fileInput" name="files[]" class="hidden" multiple required>
            </div>
            
            <div id="fileInfo" class="hidden text-center text-sm font-medium text-indigo-600 bg-indigo-50 p-2 rounded-lg"></div>

            <button type="submit" id="convertBtn" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg font-bold text-lg transition disabled:opacity-50">
                Process Document
            </button>
        </form>

        <div id="statusArea" class="mt-8 text-center hidden">
            <p id="statusText" class="text-indigo-600 font-semibold mb-2">Processing...</p>
            <div class="progress-bar-container block">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div id="resultArea" class="hidden mt-6 p-6 bg-green-50 rounded-xl border border-green-200 text-center">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Task Complete!</h3>
            <a id="downloadLink" href="#" class="inline-block py-3 px-6 bg-green-500 hover:bg-green-600 text-white font-bold rounded shadow transition">Download File</a>
        </div>
    </section>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const workspaceContainer = document.getElementById('workspaceContainer');
        const toolIcon = document.getElementById('toolIcon');
        const toolTitle = document.getElementById('toolTitle');
        const conversionTypeHidden = document.getElementById('conversionType');
        const dynamicSettings = document.getElementById('dynamicSettings');

        function openWorkspace(tool) {
            gridContainer.classList.add('hidden');
            workspaceContainer.classList.remove('hidden');
            toolIcon.innerText = tool.icon;
            toolTitle.innerText = tool.name;
            conversionTypeHidden.value = tool.id;

            // Reset UI
            document.getElementById('uploadForm').reset();
            document.getElementById('fileInfo').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('statusArea').classList.add('hidden');
            document.getElementById('convertBtn').disabled = false;

            // Hide all dynamic blocks
            ['passwordBlock','languageBlock','compressPdfBlock','compressImgBlock','imgFormatBlock'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            // Show relevant blocks
            let showSettings = false;
            if (tool.id === 'unlock-pdf' || tool.id === 'protect-pdf') { document.getElementById('passwordBlock').classList.remove('hidden'); showSettings=true; }
            if (tool.id === 'translate-pdf') { document.getElementById('languageBlock').classList.remove('hidden'); showSettings=true; }
            if (tool.id === 'compress-pdf') { document.getElementById('compressPdfBlock').classList.remove('hidden'); showSettings=true;}
            if (tool.id === 'compress-image') { document.getElementById('compressImgBlock').classList.remove('hidden'); showSettings=true;}
            if (tool.id === 'convert-image-format') { document.getElementById('imgFormatBlock').classList.remove('hidden'); showSettings=true;}

            if (showSettings) dynamicSettings.classList.remove('hidden');
            else dynamicSettings.classList.add('hidden');
        }

        function closeWorkspace() {
            gridContainer.classList.remove('hidden');
            workspaceContainer.classList.add('hidden');
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');

        dropZone.addEventListener('click', () => fileInput.click());
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }));
        ['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.add('active')));
        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.remove('active')));

        dropZone.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; fileInfo.innerText = e.dataTransfer.files.length + " files ready"; fileInfo.classList.remove('hidden'); }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) { fileInfo.innerText = fileInput.files.length + " files ready"; fileInfo.classList.remove('hidden'); }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!fileInput.files.length) return alert('Select files first');
            
            document.getElementById('convertBtn').disabled = true;
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            let progress = 0;
            const pb = document.getElementById('progressBar');
            const pt = setInterval(() => { progress += Math.random()*5; if(progress>90) progress=90; pb.style.width=progress+'%'; }, 300);

            try {
                // Read files as Base64 for safe serverless UTF-8 transmission
                const filePromises = Array.from(fileInput.files).map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve({ name: file.name, data: reader.result });
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                });

                const filesData = await Promise.all(filePromises);

                const payload = {
                    conversion_type: document.getElementById('conversionType').value,
                    password: document.getElementById('password')?.value || '',
                    target_lang: document.getElementById('targetLang')?.value || '',
                    compression_level: document.getElementById('pdfCompressLevel')?.value || 'medium',
                    target_kb: document.getElementById('imgCompressKb')?.value || '500',
                    target_format: document.getElementById('imgFormatSelect')?.value || 'JPG',
                    files: filesData
                };

                const res = await fetch('/upload', { 
                    method: 'POST', 
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                clearInterval(pt);
                pb.style.width = '100%';

                if(res.ok && json.success) {
                    setTimeout(() => {
                        document.getElementById('statusArea').classList.add('hidden');
                        document.getElementById('resultArea').classList.remove('hidden');
                        document.getElementById('downloadLink').href = json.download_url;
                    }, 500);
                } else throw new Error(json.error || 'Conversion failed.');
            } catch (err) {
                clearInterval(pt);
                pb.style.width = '0%';
                document.getElementById('statusText').innerText = err.message;
                document.getElementById('statusText').classList.replace('text-indigo-600', 'text-red-600');
            } finally {
                document.getElementById('convertBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
